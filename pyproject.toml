[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recordtree-downloader-sqlite"
version = "0.1.0"
description = "Local SQLite-backed Record Tree downloader CLI."
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "rich",
    "typer",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
]
dev = [
    "fastapi",
    "httpx2",
    "python-multipart",
    "pytest",
    "ruff",
    "uvicorn[standard]",
]

[project.scripts]
recordtree = "recordtree.cli:app"

[tool.setuptools.packages.find]
include = ["recordtree*"]

[tool.setuptools.package-data]
recordtree = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Errors only: syntax, undefined names, unused imports. Pinning the selection
# keeps a ruff upgrade from changing what the CI gate rejects.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
