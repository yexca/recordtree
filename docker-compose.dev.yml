services:
  recordtree-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: recordtree-dev:latest
    container_name: recordtree-dev
    working_dir: /workspace
    command: sleep infinity
    ports:
      - "127.0.0.1:7647:7647"
      - "127.0.0.1:5173:5173"
    environment:
      TZ: Asia/Tokyo
    volumes:
      - .:/workspace
      - recordtree-dev-node-modules:/workspace/web/node_modules
      - ./config/mega-dev:/root/.megaCmd

volumes:
  recordtree-dev-node-modules:
