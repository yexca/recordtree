<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1715" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ad4f2f'/%3E%3Cpath d='M11 9.5v13M11 16h7.5M11 22.5h7.5' stroke='%23f7f3ed' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='11' cy='9.5' r='2.6' fill='%23f7f3ed'/%3E%3Ccircle cx='21' cy='16' r='2.6' fill='%23f7f3ed'/%3E%3Ccircle cx='21' cy='22.5' r='2.6' fill='%23f7f3ed'/%3E%3C/svg%3E"
    />
    <title>RecordTree</title>
    <script>
      // Apply the saved color scheme before first paint to avoid a light flash in dark mode.
      (function () {
        try {
          var saved = localStorage.getItem('mantine-color-scheme-value') || 'auto';
          var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
