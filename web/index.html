<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbeff4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24171f" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f08aac'/%3E%3Cstop offset='1' stop-color='%23a47ad6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M11 9.5v13M11 16h7.5M11 22.5h7.5' stroke='%23ffe6ef' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='11' cy='9.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='21' cy='16' r='2.6' fill='%23fff'/%3E%3Ccircle cx='21' cy='22.5' r='2.6' fill='%23ffd3e2'/%3E%3C/svg%3E"
    />
    <title>RecordTree</title>
    <script>
      // Apply the saved color scheme before first paint to avoid a light flash in dark mode.
      (function () {
        try {
          var saved = localStorage.getItem('mantine-color-scheme-value') || 'auto';
          var dark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
