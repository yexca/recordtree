name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: recordtree
  # The Dockerfile installs the amd64 MEGAcmd package, so the image is amd64 only.
  IMAGE_PLATFORMS: linux/amd64

jobs:
  verify_release:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Reads the Full runs of the tagged commit.
      contents: read
    steps:
      # Full history, so the tag can be compared with main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $package_version." >&2
            exit 1
          fi

      - name: Verify release notes
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes_file" ]; then
            echo "Release notes are missing or empty: $notes_file" >&2
            exit 1
          fi

      - name: Verify the tagged commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main." >&2
            exit 1
          fi

      # Full runs every validation job on the same commit, so its result is the
      # release's validation. Nothing is published from a commit without a
      # passing Full run.
      - name: Require a successful Full run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/full.yml/runs?head_sha=${GITHUB_SHA}&per_page=100"
          passed="$(gh api "${runs_api}&status=success" --jq '.workflow_runs | length')"
          if [ "$passed" -gt 0 ]; then
            echo "Full passed for $GITHUB_SHA."
            exit 0
          fi
          echo "No successful Full run exists for $GITHUB_SHA. Wait for Full to pass, or start it on $GITHUB_REF_NAME from the Actions page, then rerun this release." >&2
          gh api "$runs_api" --jq '.workflow_runs[] | "\(.html_url) status=\(.status) conclusion=\(.conclusion)"' >&2
          exit 1

  push_image:
    name: Push image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs:
      - verify_release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image references must be lowercase, so they use the owner and the
      # image name rather than the repository name.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=RecordTree
            org.opencontainers.image.description=Local SQLite-backed Record Tree downloader with a WebUI

      - name: Build and push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    needs:
      - push_image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Rerunning a release keeps the existing Release instead of failing.
      - name: Create release from release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "RecordTree $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
