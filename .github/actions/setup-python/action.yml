name: Set up Python
description: Install uv, the Python version pinned in .python-version, which matches the runtime image, and the locked dev environment.
runs:
  using: composite
  steps:
    # uv reads .python-version and installs that Python itself.
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install the locked environment
      shell: bash
      run: make python-install
