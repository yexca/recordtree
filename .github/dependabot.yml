# Toolchain majors (Python, Node) are pinned in .python-version, .nvmrc, and
# the Dockerfile stages; upgrade them by hand in one change. Python packages
# are not listed: pyproject.toml declares unpinned ranges that Dependabot
# cannot bump, and security alerts cover them separately.
version: 2
updates:
  - package-ecosystem: github-actions
    # The root covers .github/workflows; composite actions are listed apart.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(actions)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-and-patch:
        update-types: [minor, patch]
