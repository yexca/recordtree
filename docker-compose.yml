services:
  recordtree-web:
    image: ${RECORDTREE_IMAGE:-yexca/recordtree:latest}
    container_name: recordtree-web
    ports:
      - "7647:7647"
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./config:/app/config
      - ./config/mega:/root/.megaCmd
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    restart: unless-stopped
