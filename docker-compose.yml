services:
  recordtree-web:
    image: ${RECORDTREE_IMAGE:-yexca/recordtree:latest}
    container_name: recordtree-web
    ports:
      - "7647:7647"
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./config:/app/config
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./files:/app/files
      - ./env/megacmd-home:/root
    restart: unless-stopped
